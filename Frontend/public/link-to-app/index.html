<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Bandeja</title>
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#e0f2fe" />
  <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(180deg, #ffe8b8 0%, #fff1d0 14%, #f0f9ff 36%, #e0f2fe 62%, #7dd3fc 100%);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(1.25rem, env(safe-area-inset-top)) max(1.25rem, env(safe-area-inset-right))
        max(1.25rem, env(safe-area-inset-bottom)) max(1.25rem, env(safe-area-inset-left));
      color: #0f172a;
    }

    .glow {
      position: fixed;
      border-radius: 9999px;
      pointer-events: none;
      z-index: 0;
    }

    .glow--a {
      right: -6%;
      bottom: 22%;
      width: 22rem;
      height: 22rem;
      background: radial-gradient(circle, rgb(14 165 233 / 0.28) 0%, transparent 70%);
    }

    .glow--b {
      left: -12%;
      bottom: 12%;
      width: 30rem;
      height: 30rem;
      background: radial-gradient(circle, rgb(6 182 212 / 0.32) 0%, transparent 70%);
    }

    .container {
      position: relative;
      z-index: 1;
      isolation: isolate;
      overflow: clip;
      border-radius: 1.75rem;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.55);
      box-shadow:
        0 8px 32px rgba(15, 23, 42, 0.1),
        0 1px 0 rgba(255, 255, 255, 0.65) inset,
        0 0 20px rgba(14, 165, 233, 0.1);
      padding: 2rem 1.75rem 1.75rem;
      max-width: 26rem;
      width: 100%;
      text-align: center;
      animation: fadeIn 0.5s ease-in;
    }

    @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .container {
        background: rgba(255, 255, 255, 0.28);
        backdrop-filter: blur(10px) saturate(150%);
        -webkit-backdrop-filter: blur(10px) saturate(150%);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      display: block;
      margin: 0 auto 1.25rem;
      width: 13rem;
      max-width: 80%;
      height: auto;
      border-radius: 0.75rem;
      background: #abdee3;
      padding: 0.25rem;
    }

    h1 {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.01em;
      margin-bottom: 10px;
      color: #0c4a6e;
    }

    .subtitle {
      font-size: 15px;
      color: #475569;
      margin-bottom: 26px;
      line-height: 1.5;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .store-button {
      display: block;
      text-decoration: none;
      transition: transform 0.2s, opacity 0.2s;
      border-radius: 12px;
      overflow: hidden;
    }

    .store-button:hover {
      transform: scale(1.02);
      opacity: 0.9;
    }

    .store-button:active {
      transform: scale(0.98);
    }

    .store-button img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
    }

    .web-button {
      display: block;
      padding: 15px 24px;
      background: linear-gradient(135deg, #0ea5e9 0%, #06b6d4 100%);
      color: #fff;
      text-decoration: none;
      border-radius: 14px;
      font-weight: 600;
      font-size: 16px;
      box-shadow: 0 10px 24px rgba(14, 165, 233, 0.35);
      transition: transform 0.2s, opacity 0.2s;
    }

    .web-button:hover {
      transform: scale(1.02);
      opacity: 0.92;
    }

    .web-button:active {
      transform: scale(0.98);
    }

    .tip {
      color: #64748b;
      font-size: 13px;
      line-height: 1.5;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid rgba(15, 23, 42, 0.1);
    }

    .loading {
      display: none;
      font-size: 14px;
      color: #475569;
      margin-bottom: 24px;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: linear-gradient(165deg, #020617 0%, #0b2740 38%, #0c4a6e 68%, #020617 100%);
        color: #e2e8f0;
      }

      .container {
        border-color: rgba(148, 163, 184, 0.12);
        background: rgba(15, 23, 42, 0.45);
        box-shadow:
          0 12px 40px rgba(0, 0, 0, 0.45),
          0 1px 0 rgba(255, 255, 255, 0.08) inset,
          0 0 22px rgba(56, 189, 248, 0.1);
      }

      @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
        .container {
          background: rgba(15, 23, 42, 0.3);
        }
      }

      .logo {
        background: transparent;
        filter: invert(1);
      }

      h1 {
        color: #f0f9ff;
      }

      .subtitle {
        color: #cbd5e1;
      }

      .tip {
        color: #94a3b8;
        border-top-color: rgba(148, 163, 184, 0.2);
      }

      .loading {
        color: #cbd5e1;
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 1.75rem 1.25rem 1.5rem;
      }

      h1 {
        font-size: 24px;
      }

      .logo {
        width: 11rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .container {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="glow glow--a"></div>
  <div class="glow glow--b"></div>
  <div class="container">
    <img class="logo" src="/bandeja2-white-tr.png" alt="Bandeja" />
    <h1 id="title">Opening…</h1>
    <p class="subtitle" id="subtitle">If nothing happens, choose your platform:</p>
    <div class="loading" id="loading">Redirecting...</div>
    
    <div class="buttons">
      <a id="ios" href="https://apps.apple.com/app/bandeja/id6756632318" class="store-button">
        <img src="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/en-us?size=250x83&releaseDate=1704067200" alt="Download on the App Store" />
      </a>
      <a id="android" href="https://play.google.com/store/apps/details?id=com.funified.bandeja" class="store-button">
        <img src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png" alt="Get it on Google Play" />
      </a>
      <a id="web" href="https://bandeja.me" class="web-button">Open Web App</a>
    </div>
    
    <p class="tip" id="tip">Tip: If you scanned a QR code inside an in-app browser, tap the button above.</p>
  </div>

  <script>
    (function () {
      const translations = {
        en: {
          title: 'Opening…',
          titleIOS: 'Get Bandeja on the App Store',
          subtitle: 'If nothing happens, choose your platform:',
          webButton: 'Open Web App',
          tip: 'Tip: If you scanned a QR code inside an in-app browser, tap the button above.',
          loading: 'Redirecting...'
        },
        ru: {
          title: 'Открытие…',
          titleIOS: 'Bandeja в App Store',
          subtitle: 'Если ничего не происходит, выберите вашу платформу:',
          webButton: 'Открыть веб-приложение',
          tip: 'Совет: Если вы отсканировали QR-код во встроенном браузере, нажмите кнопку выше.',
          loading: 'Перенаправление...'
        },
        sr: {
          title: 'Otvaranje…',
          titleIOS: 'Bandeja na App Store-u',
          subtitle: 'Ako se ništa ne dešava, izaberite vašu platformu:',
          webButton: 'Otvori web aplikaciju',
          tip: 'Savet: Ako ste skenirali QR kod u ugrađenom pregledaču, pritisnite dugme iznad.',
          loading: 'Preusmeravanje...'
        },
        es: {
          title: 'Abriendo…',
          titleIOS: 'Bandeja en App Store',
          subtitle: 'Si no pasa nada, elige tu plataforma:',
          webButton: 'Abrir aplicación web',
          tip: 'Consejo: Si escaneaste un código QR dentro de un navegador integrado, toca el botón de arriba.',
          loading: 'Redirigiendo...'
        },
        cs: {
          title: 'Otevírání…',
          titleIOS: 'Bandeja v App Store',
          subtitle: 'Pokud se nic nestane, zvolte svou platformu:',
          webButton: 'Otevřít webovou aplikaci',
          tip: 'Tip: Pokud jste naskenovali QR kód v prohlížeči v aplikaci, klepněte na tlačítko výše.',
          loading: 'Přesměrovávání...'
        }
      };
      
      const storeBadges = {
        en: {
          ios: 'https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/en-us?size=250x83&releaseDate=1704067200',
          android: 'https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png'
        },
        ru: {
          ios: 'https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/ru-ru?size=250x83&releaseDate=1704067200',
          android: 'https://play.google.com/intl/ru/badges/static/images/badges/ru_badge_web_generic.png'
        },
        sr: {
          ios: 'https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/en-us?size=250x83&releaseDate=1704067200',
          android: 'https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png'
        },
        es: {
          ios: 'https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/es-es?size=250x83&releaseDate=1704067200',
          android: 'https://play.google.com/intl/es/badges/static/images/badges/es_badge_web_generic.png'
        },
        cs: {
          ios: 'https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/cs-cz?size=250x83&releaseDate=1704067200',
          android: 'https://play.google.com/intl/cs/badges/static/images/badges/cs_badge_web_generic.png'
        }
      };
      
      function detectLanguage() {
        const browserLang = navigator.language || navigator.userLanguage || 'en';
        const langCode = browserLang.split('-')[0].toLowerCase();
        
        if (translations[langCode]) {
          return langCode;
        }
        
        const fullLang = browserLang.toLowerCase();
        if (fullLang.startsWith('ru')) return 'ru';
        if (fullLang.startsWith('sr')) return 'sr';
        if (fullLang.startsWith('es')) return 'es';
        if (fullLang.startsWith('cs')) return 'cs';
        
        return 'en';
      }
      
      function setLanguage(lang) {
        const t = translations[lang];
        const badges = storeBadges[lang];
        
        document.getElementById('title').textContent = t.title;
        document.getElementById('subtitle').textContent = t.subtitle;
        document.getElementById('web').textContent = t.webButton;
        document.getElementById('tip').textContent = t.tip;
        document.getElementById('loading').textContent = t.loading;
        
        document.getElementById('ios').querySelector('img').src = badges.ios;
        document.getElementById('ios').querySelector('img').alt = lang === 'ru' ? 'Загрузить в App Store' : 
                                                                  lang === 'sr' ? 'Preuzmi u App Store' :
                                                                  lang === 'es' ? 'Descargar en App Store' :
                                                                  lang === 'cs' ? 'Stáhnout z App Store' :
                                                                  'Download on the App Store';
        
        document.getElementById('android').querySelector('img').src = badges.android;
        document.getElementById('android').querySelector('img').alt = lang === 'ru' ? 'Получить в Google Play' :
                                                                       lang === 'sr' ? 'Preuzmi na Google Play' :
                                                                       lang === 'es' ? 'Consíguelo en Google Play' :
                                                                       lang === 'cs' ? 'Získat na Google Play' :
                                                                       'Get it on Google Play';
        
        document.documentElement.lang = lang;
      }
      
      const lang = detectLanguage();
      setLanguage(lang);
      
      const ua = navigator.userAgent || "";
      const isAndroid = /Android/i.test(ua);
      const isIPadOS = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
      const isIOS = /iPhone|iPad|iPod/i.test(ua) || isIPadOS;

      const qs = window.location.search || '';
      const params = new URLSearchParams(qs);
      function readCookie(name) {
        const parts = document.cookie.split(';');
        for (let i = 0; i < parts.length; i += 1) {
          const bit = parts[i].trim();
          if (bit.indexOf(name + '=') === 0) return bit.slice(name.length + 1);
        }
        return '';
      }
      function makeAid() {
        const alphabet = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        const bytes = new Uint8Array(16);
        crypto.getRandomValues(bytes);
        let out = '';
        for (let i = 0; i < 16; i += 1) out += alphabet[bytes[i] % alphabet.length];
        return out;
      }
      var aid = params.get('aid') || readCookie('bandeja_aid') || makeAid();
      if (!/^[a-zA-Z0-9]{8,32}$/.test(aid)) aid = makeAid();
      var stored = null;
      try { stored = JSON.parse(localStorage.getItem('bandeja.attribution') || 'null'); } catch (_e) { stored = null; }
      if (stored && stored.aid && /^[a-zA-Z0-9]{8,32}$/.test(stored.aid)) aid = stored.aid;
      else if (readCookie('bandeja_aid') && /^[a-zA-Z0-9]{8,32}$/.test(readCookie('bandeja_aid'))) aid = readCookie('bandeja_aid');
      params.set('aid', aid);
      document.cookie = 'bandeja_aid=' + aid + '; Path=/; Max-Age=31536000; SameSite=Lax';
      function firstUtm(key, paramName) {
        var prev = stored && stored[key];
        if (prev) return prev;
        return params.get(paramName);
      }
      try { localStorage.setItem('bandeja.attribution', JSON.stringify({
        aid: aid,
        utmSource: firstUtm('utmSource', 'utm_source'),
        utmMedium: firstUtm('utmMedium', 'utm_medium'),
        utmCampaign: firstUtm('utmCampaign', 'utm_campaign'),
        utmContent: firstUtm('utmContent', 'utm_content'),
        utmTerm: firstUtm('utmTerm', 'utm_term'),
        choice: (stored && stored.choice) || null
      })); } catch (_e) {}
      const markedQs = '?' + params.toString();
      const iosEl = document.getElementById('ios');
      const androidEl = document.getElementById('android');
      const webEl = document.getElementById('web');
      iosEl.href = '/api/public/link-to-app/go/ios' + markedQs;
      androidEl.href = '/api/public/link-to-app/go/android' + markedQs;
      webEl.href = '/api/public/link-to-app/go/web' + markedQs;

      function persistChoice(choice) {
        try {
          var raw = JSON.parse(localStorage.getItem('bandeja.attribution') || '{}');
          raw.aid = aid;
          raw.choice = choice;
          localStorage.setItem('bandeja.attribution', JSON.stringify(raw));
        } catch (_e) {}
      }
      function copyAid() {
        const text = 'bandeja-aid:' + aid;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text).catch(function () {});
        }
        return Promise.resolve();
      }
      iosEl.addEventListener('click', function () { persistChoice('ios'); copyAid(); });
      androidEl.addEventListener('click', function () { persistChoice('android'); copyAid(); });
      webEl.addEventListener('click', function () { persistChoice('web'); copyAid(); });

      (function trackView() {
        const viewParams = new URLSearchParams(params);
        viewParams.set('kind', 'view');
        const url = '/api/public/link-to-app/hit?' + viewParams.toString();
        try {
          fetch(url, { keepalive: true, credentials: 'include', cache: 'no-store', mode: 'same-origin' });
        } catch (_err) {
          new Image().src = url;
        }
      })();
      
      let redirected = false;
      
      function redirect() {
        if (redirected) return;
        redirected = true;
        var choice = isIOS ? 'ios' : (isAndroid ? 'android' : 'web');
        persistChoice(choice);
        const target = isIOS ? iosEl.href : (isAndroid ? androidEl.href : webEl.href);
        document.getElementById('loading').style.display = 'block';
        document.getElementById('subtitle').style.display = 'none';
        copyAid().then(function () {
          window.location.replace(target);
        });
        setTimeout(function () {
          window.location.replace(target);
        }, 600);
      }
      
      if (isIOS) {
        document.getElementById('title').textContent = translations[lang].titleIOS;
        document.getElementById('subtitle').style.display = 'block';
      } else {
        setTimeout(redirect, 500);
      }
    })();
  </script>
</body>
</html>
